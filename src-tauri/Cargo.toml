[package]
name = "hoan-hoc-tieng-trung"
version = "1.0.0"
description = "A modern Chinese learning desktop application with SRS, TTS, and dictionary lookup"
authors = ["You"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
md-5 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22.1"
